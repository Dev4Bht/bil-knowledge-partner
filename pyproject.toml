[project]
name = "bil-knowledge-partner"
version = "0.1.0"
description = "BIL Agentic Knowledge Partner: DMS, knowledge layer and agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
